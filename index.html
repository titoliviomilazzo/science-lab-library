<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Science Lab Library</title><style>
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;color:#1c2928;background:#f4f7f5}header{background:#fff;padding:19px max(24px,calc((100vw - 1200px)/2));display:flex;justify-content:space-between;align-items:center}header strong{font-size:19px}header span{color:#53645f;font-size:14px}.wrap{max-width:1200px;margin:auto;padding:28px 24px}.notice{background:#d9eae5;padding:10px 14px;font-size:14px}.intro{display:grid;grid-template-columns:1fr 320px;align-items:center;gap:20px;padding:18px 0}h1{font-size:32px;margin:0 0 8px;letter-spacing:-.03em}p{margin:0;color:#42534f}.orbit{height:150px;background:#e1ece8;position:relative;overflow:hidden}.orbit canvas{width:100%;height:100%;display:block}.fallback{position:absolute;inset:0;display:grid;place-items:center;color:#416860}.filters{background:white;padding:20px;display:flex;align-items:end;gap:14px;flex-wrap:wrap}label{font-size:14px;font-weight:600;display:grid;gap:6px;min-width:180px}select{font:inherit;color:#243530;background:#fff;border:1px solid #aebbb6;padding:10px;min-height:44px}h2{font-size:20px;margin:28px 0 12px}.meta{color:#586a64;font-size:14px}.list{background:#fff}.row{display:grid;grid-template-columns:200px 1fr auto;gap:22px;align-items:center;padding:16px;border-bottom:1px solid #e4ebe7}.row img{width:200px;height:112px;object-fit:cover}.row h3{font-size:19px;margin:0 0 5px}.row p{font-size:15px}.row small{display:block;margin-top:8px;color:#53645f}.button{border:0;background:#163f39;color:#fff;font:600 15px system-ui;padding:13px 18px;white-space:nowrap}.footer{font-size:13px;padding:22px 0;color:#53645f}@media(max-width:650px){header{padding:16px}.wrap{padding:18px 16px}.intro{grid-template-columns:1fr}.orbit{height:100px}h1{font-size:25px}.filters{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}label{min-width:0}select{width:100%}.row{grid-template-columns:110px 1fr;gap:12px;padding:12px}.row img{width:110px;height:85px}.row h3{font-size:16px}.row p{font-size:14px}.button{grid-column:2;justify-self:start}.row small{font-size:12px}}
</style><style>.button{display:inline-block;text-decoration:none;text-align:center}.empty{padding:24px}.button:focus-visible,select:focus-visible{outline:3px solid #267c71;outline-offset:3px}@media(max-width:900px){.intro{grid-template-columns:minmax(0,1fr) minmax(180px,28%)}.row{grid-template-columns:minmax(120px,200px) minmax(0,1fr) auto}.row img{width:100%}h1{font-size:clamp(24px,3.2vw,32px)}}@media(max-width:650px){.intro{grid-template-columns:1fr}.row{grid-template-columns:100px minmax(0,1fr)}.row img{width:100px}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}label{min-width:0}h1{font-size:clamp(24px,6vw,28px)}} </style></head><body><header><strong>◉ Science Lab Library</strong><span>Classroom simulations</span></header><main class="wrap"><section class="intro"><div><h1>Find a simulation for your class</h1><p>Choose a grade and subject, then open a hands-on activity.</p></div><div class="orbit" aria-label="Decorative model of a planet orbiting a star"><div class="fallback">A planet orbiting its star</div><canvas id="scene" aria-hidden="true"></canvas></div></section><section class="filters" aria-label="Filter simulations"><label>Grade<select id="grade"><option value="">All grades</option></select></label><label>Subject<select id="subject"><option value="">All subjects</option></select></label><label>Topic<select id="topic"><option value="">All topics</option></select></label></section><h2>Simulations</h2><p class="meta" id="count" aria-live="polite"></p><div class="list" id="list"></div><div class="footer">Planet Hunter data are synthetic. Models simplify real planetary systems.</div></main><script src="catalog.js"></script><script src="app.js"></script><script type="module">try{const T=await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');const canvas=document.querySelector('#scene'),renderer=new T.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scene=new T.Scene(),camera=new T.PerspectiveCamera(38,1,.1,100);camera.position.set(0,4,8);camera.lookAt(0,0,0);scene.add(new T.HemisphereLight(0xffffff,0x6a8379,2));const star=new T.Mesh(new T.SphereGeometry(.8,32,20),new T.MeshStandardMaterial({color:0xd29d3f}));scene.add(star);const ring=new T.Mesh(new T.RingGeometry(2.35,2.39,96),new T.MeshBasicMaterial({color:0x638f82,side:T.DoubleSide}));ring.rotation.x=-Math.PI/2;scene.add(ring);const planet=new T.Mesh(new T.SphereGeometry(.32,24,16),new T.MeshStandardMaterial({color:0x316b72}));scene.add(planet);document.querySelector('.fallback').style.display='none';let a=.7;function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();planet.position.set(Math.cos(a)*2.37,0,Math.sin(a)*2.37);renderer.render(scene,camera);if(!matchMedia('(prefers-reduced-motion: reduce)').matches){a+=.004;requestAnimationFrame(draw)}}draw()}catch(e){document.querySelector('#scene').style.display='none'}</script></body></html>
